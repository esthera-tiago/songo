<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songo Game - Accueil</title>
    <style>
        :root {
            --primary: #2c1a0e;
            --secondary: #4a2c0e;
            --accent: #e67e22;
            --bg: #ecf0f1;
            --text: #f5deb3;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background-color: var(--white);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 2rem;
            font-size: 2.5rem;
            letter-spacing: -1px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .btn {
            display: block;
            padding: 1.2rem;
            text-decoration: none;
            color: var(--white);
            background-color: var(--primary);
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .btn:hover {
            background-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.3);
        }

        .btn-secondary {
            background-color: var(--secondary);
        }

        p {
            margin-top: 2rem;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Songo Game</h1>
        <div class="menu">
            <a href="version_locale/index.html" class="btn">Jouer en Local</a>
            <a href="version_reseau/index.html" class="btn btn-secondary">Jouer en Réseau</a>
        </div>
        <p>Sélectionnez un mode de jeu pour commencer</p>
    </div>
</body>

</html>
